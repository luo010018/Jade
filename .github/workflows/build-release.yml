name: Build & Release IPA

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -project Jade.xcodeproj \
            -scheme Jade \
            -configuration Release \
            -archivePath build/Jade.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Jade.xcarchive -name "*.app" | head -1)
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r ../Jade.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jade-IPA
          path: "Jade.ipa"
